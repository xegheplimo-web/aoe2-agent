# Windows CI — proves the agent gates pass on the platform the game loop runs on.
#
# Why this exists: upstream `ci.yml` runs `lint-typecheck-test` only on
# ubuntu-latest. The 2026-10 clock-granularity bug (Windows `time.monotonic()`
# ticks at ~15.6 ms / GetTickCount64) made five spatial-refresh tests fail on
# Windows while Ubuntu stayed green — this job closes that blind spot for all
# future platform-specific breakage.
#
# Kept intentionally close to `.github/workflows/ci.yml`. Deliberate
# divergences, both reasoned:
#   * Sync step: upstream uses `uv sync --all-extras`; here we use `--locked`.
#     The extras (training / labeling / coreml / autolabel) pull heavy optional
#     deps (ultralytics, sahi, coremltools) the unit suite never imports, and
#     some of them ship Linux/macOS-first wheels. The default dev group
#     (pytest, ruff, basedpyright, fakeredis, redis, hypothesis) is included by
#     uv automatically — it is everything the gates below need. If a future
#     test genuinely imports an extra, that test will (correctly) skip here and
#     the sync step should grow the specific extra back.
#   * No `dashboard-build` job: the dashboard is platform-neutral; the failure
#     modes this workflow guards against are in the Python agent runtime.
name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-test-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Verify all docker-compose images are digest-pinned
        shell: bash
        run: |
          if grep -rE '^\s*image:' docker-compose*.yml | grep -v '@sha256:'; then
            echo "::error::Found docker-compose image lines without @sha256: digests"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify uv.lock is up to date
        run: uv lock --locked

      - name: Sync workspace (locked; dev group included)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: basedpyright type-check
        run: uv run basedpyright

      - name: Pytest
        run: uv run pytest -q
